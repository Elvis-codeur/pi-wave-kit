name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # uv, not pip -- this project family's standing rule. No uv.lock exists (this is a library,
      # not a locked app), so dependency-glob caching has nothing to key on -- leave it off
      # rather than fail the run on setup-uv's own "no file matched" error.
      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install pi-wave-kit (+ dev extras)
        run: uv pip install --system -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest, full suite)
        run: pytest -v
