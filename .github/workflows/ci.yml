name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # uv, not pip -- this project family's standing rule. No uv.lock exists (this is a library,
      # not a locked app), so dependency-glob caching has nothing to key on -- leave it off
      # rather than fail the run on setup-uv's own "no file matched" error.
      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      # A real venv (not --system -- the runner's system Python is externally managed and
      # refuses package installs outright), same as local dev setup in CONTRIBUTING.md.
      - name: Create venv and install pi-wave-kit (+ dev extras)
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Lint (ruff)
        run: .venv/bin/ruff check .

      - name: Test (pytest, full suite)
        run: .venv/bin/pytest -v
