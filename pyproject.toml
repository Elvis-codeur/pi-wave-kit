[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-wave-kit"
version = "0.1.0"
description = "Orchestrate a 'wave' of headless Pi (or any CLI coding-agent) worker processes under a concurrency AND cumulative-dollar-budget cap, with an escalation protocol and a generic stage-check framework -- extracted from a real, months-long production use (DeepSeek translation waves)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "llm-ledger-client>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["pi_wave_kit*"]

[tool.setuptools.package-data]
"pi_wave_kit.plugins.stt_translation" = ["prompts/*.md"]
