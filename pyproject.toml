[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-wave-kit"
version = "0.1.0"
description = "Orchestrate a 'wave' of headless Pi (or any CLI coding-agent) worker processes under a concurrency AND cumulative-dollar-budget cap, with an escalation protocol and a generic stage-check framework -- extracted from a real, months-long production use (DeepSeek translation waves)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "llm-ledger-client>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pi-wave-job = "pi_wave_kit.cli:main"

[tool.setuptools.packages.find]
include = ["pi_wave_kit*"]

[tool.setuptools.package-data]
"pi_wave_kit.plugins.stt_translation" = ["prompts/*.md"]

[tool.ruff]
# 160, not the default 88/120: this codebase's own narrative style (long docstrings-as-comments
# explaining WHY, dense one-liners in tests) already runs past 120 in places -- checked the real
# max (152) rather than picking a number and reformatting the repo to fit it.
line-length = 160
target-version = "py310"

[tool.ruff.lint]
# Pyflakes + pycodestyle + isort: catches real bugs (unused imports/vars, undefined names) and
# keeps imports sorted, without imposing an opinionated style this already-written codebase
# would need a disruptive reformat to satisfy. Widen this later if the project wants more.
select = ["E", "F", "I"]
